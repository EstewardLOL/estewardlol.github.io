<!DOCTYPE html> <!-- This is the document type declaration for an HTML5 document -->
<html>
    <!-- The head tag is the behind the scenes part of the HTML document.
     Meaning it contains information about the document that is not displayed on the page
     Think of it as a human, the head is the brain and the body is the physical form -->
<head>
    <title>My Tutorials Project in HTML!</title>

    <!-- This is an example of a favicon, which is the small icon that appears in the browser tab.
    The link tag connects our webpage to the background files it needs -->
    <link rel="icon" type="image/jpg" href="Misc/Face.jpeg">
</head>
<body>
    <main>
        <h1 style="margin: auto;">We use index.html for our homepage!</h1>
        <h2>The above is an example of H1 Heading!</h2>
        <hr> <!-- This adds a horizontal line -->
        <!-- An alternative to <p> tags are <pre> which means preformatted 
        Below are also examples of other text formatting tags -->
        <p>This is an example of a <b>paragraph!</b></p>
        <p>The <i><mark>Body</mark></i> represents everything that we could see inside our website!</p>
        <p>The <u>Head</u> is our <big>website's title!</big></p>
        <p><sub>Subscript</sub> | <sup>Superscript</sup></p>

        <!-- This is an example of an image with a width of 100, the height adjusts automatically. Vice Versa
        The alt attribute adds a description for when the image wont appear -->
        <h1>This is me</h1>
        <a href="https://www.facebook.com/ETJR" title="Wow!" target="_blank">
        <img src="Misc/Face.jpeg" width="100" alt="A picture of my face">
        </a>

        <br> <!-- This adds a line break --> 
    </main>
        
    
    <footer style="background-color: blueviolet;">
        <h3>footer</h3>
        made with ♥️
        <!-- This is an example of a hyperlink to my GitHub repository 
        The target="_blank" attribute opens the link in a new tab while the title attribute provides a tooltip -->
        <a href="https://github.com/EstewardLOL/HTML-AND-CSS-PROJECT" target="_blank" title="My GitHub Repository">GITHUB REPO!</a>
        <a href="etc.html">idk</a>
        <a href="lobby.html">Chill?</a>
    </footer>
</body>
</html>
