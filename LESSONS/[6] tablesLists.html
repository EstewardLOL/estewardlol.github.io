<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h3>Example Table</h3>
    <table border="1">
        <tr style="text-align: left;"> <!-- Table Row -->
            <th>1</th>
            <th>2</th>
        </tr>
        <tr>
            <td>This is 1</td> <!-- Table Data -->
            <td>This is 2</td>
        </tr>
    </table>

    <h2>Unordered list</h2>
    <ul>
        <li>Computer</li>
        <li>Bike</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Computer</li>
        <li>Bike</li>
    </ol>

    <h2>Description List</h2>
    <dl>
        <dt>Term</dt>
        <dd>Description</dd>
    </dl>
</body>
</html>
