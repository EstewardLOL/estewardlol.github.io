<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <h3> Normal</h3>
    <h3> <b>Bold</b> </h3>
    <h3> <i>Italic</i> </h3>
    <h3> <u>Underlined</u> </h3>
    <h3> <del>Strikethrough</del> </h3>
    <h3> <big>Big</big> </h3>
    <h3> <small>Small</small> </h3>
    <h3> <sub>Subscript</sub> </h3>
    <h3> <sup>Superscript</sup> </h3>
    <h3> <tt>Monospaced</tt> </h3>
    <h3> <mark style="background-color: lightblue;">Highlight</mark> </h3>
</body>
</html>
