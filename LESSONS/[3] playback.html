<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audios & Videos</title>
</head>
<body> 
    <!-- # Also enclosing a(n) audio/video tag with anchor tags allows you to add a hyperlink when clicking a(n) video/image -->
    <h3>Video</h3>
    <!-- Some useful attributes may include:
         src, controls, autoplay, loop, muted, poster, width, height, playsinline-->
    <video src="../ASSETS/W.mp4" width="250px" controls loop></video>
    <h3>Audio</h3>
    <!-- Some useful attributes may include:
         src, controls, autoplay, loop, muted, preload-->
    <audio src="../ASSETS/Closer - The Chainsmokers.mp3" controls loop></audio>
</body>
</html>
