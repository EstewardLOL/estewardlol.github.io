<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>

    <form>
        <!-- "for" enables so that when clicking the label, it goes to the input-->
        <label for="username">Username:</label>
        <input type="text" id="username" required placeholder="_.exwrlol"><br>

        <label for="pass">Password:</label>
        <input type="password" id="pass"><br>

        <label for="date">Date:</label>
        <input type="date" id="date"><br>

        <label for="num">Number:</label>
        <input type="number" id="num" value="1" min="1"><br>  

        <!--Radio-->
        <label for="fav">Favorite:</label>

        <!--"name" - so that we could group these options together-->
        <label for="cookie">cookie</label>
        <input type="radio" id="cookie" value="cookie" name="fav">

        <label for="cake">cake</label>
        <input type="radio" id="cake" value="cake" name="fav"><br>
        <!--Radio-->

        <label for="pick">Pick?</label>
        <select id="pick?">
            <option value="hi">Choose an option</option>
            <option value="1"> option 1</option>
        </select><br>

        <label for="agree">Agree</label>
        <input type="checkbox" id="agree"><br>

        <label for="txtarea">Opinions:</label>
        <textarea id="txtarea"></textarea><br><br>

        <label for="file">File:</label>
        <input type="file" id="file" accept="image/png, image/jpeg">

        <br>
        <br>
        <input type="reset">
        <input type="submit">

    </form>

</body>
</html>
