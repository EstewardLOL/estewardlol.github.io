<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
</head>
<body>
    <!-- src = file location
         alt = alternative description; for screen readers or for when the img wont load
         # Some other more necessary attributes include:
         width, height, loading(eager, lazy)
         # Also enclosing an img tag with anchor tags allows you to add a hyperlink when clicking that image-->
    <a href="https://youtube.com" target="_blank" title="click me">
    <img src="../ASSETS/Face.jpeg" alt="This is me">
    </a>
    <img src="../ASSETS/dancing-cat-dance.gif" alt="Dancing Cat" width="250px">
</body>
</html>
