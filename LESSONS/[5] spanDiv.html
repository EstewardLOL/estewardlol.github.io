<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span and Divs</title>
</head>
<body>
    <!-- <span> inline container to group elements for styling purposes -->

    <h3><span style="background-color: lightblue;">This is a span group container; While this only takes what it needs?</span></h3>

    <!-- <div> block container to group elements for styling purposes -->
    
    <h3><div style="background-color: lightblue;">This is a div group container; Notice how it takes up most of the line?</div></h3>

</body>
</html>
